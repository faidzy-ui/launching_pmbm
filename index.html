<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peresmian PMBM MTs Daarul Hikmah Pamulang</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#050505', 
                        gold: {
                            300: '#fef08a',
                            400: '#f3e5ab',
                            500: '#d4af37',
                            600: '#aa8c2c',
                            700: '#80661b',
                        }
                    },
                    fontFamily: {
                        heading: ['Montserrat', 'sans-serif'],
                        body: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow: hidden; /* Mencegah scroll selama presentasi */
            user-select: none;
        }

        /* --- System Scene Management --- */
        .scene {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease-in-out;
            z-index: 10;
        }
        .scene.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 20;
        }

        /* --- Glow & Gradient Text Effects --- */
        .text-gold-gradient {
            background: linear-gradient(135deg, #fef08a 0%, #d4af37 50%, #aa8c2c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .glow-title {
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.6), 0 0 50px rgba(212, 175, 55, 0.4);
        }

        .glow-gold-text {
            background: linear-gradient(to right, #f3e5ab, #d4af37, #fef08a, #d4af37);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 4s infinite linear;
        }
        @keyframes shineText {
            to { background-position: 200% center; }
        }

        /* --- 3D Blue Physical Button (Scene 2) --- */
        .btn-3d-wrapper {
            position: relative;
            display: inline-block;
            border-radius: 50%;
            padding: 18px;
            background: linear-gradient(145deg, #1f2937, #050505);
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), inset 0 2px 6px rgba(255,255,255,0.15);
            margin-bottom: 1.5rem;
        }
        
        .btn-3d {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            /* Gradient Biru 3D */
            background: radial-gradient(circle at 50% 30%, #60a5fa 0%, #3b82f6 45%, #1e40af 100%);
            box-shadow: 
                inset 0 6px 14px rgba(255,255,255,0.6), 
                inset 0 -10px 20px rgba(0,0,0,0.6), 
                0 22px 0 #172554, 
                0 32px 45px rgba(0, 0, 0, 0.85);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-3d:hover {
            filter: brightness(1.1);
        }
        
        .btn-3d.pressed {
            transform: translateY(22px);
            box-shadow: 
                inset 0 6px 12px rgba(255,255,255,0.6), 
                inset 0 -10px 20px rgba(0,0,0,0.6), 
                0 0px 0 #172554, 
                0 10px 15px rgba(0, 0, 0, 0.8);
        }
        
        .btn-3d-icon {
            width: 85px;
            height: 85px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.5;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
        }

        /* --- Countdown Display --- */
        #countdown-container {
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #countdown-container.visible {
            display: block;
            opacity: 1;
        }
        .countdown-number {
            font-family: 'Montserrat', sans-serif;
            font-size: 22rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(to bottom, #ffffff, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 60px rgba(212, 175, 55, 0.6);
            transform: scale(0.5);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .countdown-number.pop {
            transform: scale(1);
        }

        /* --- Final Reveal Text Container --- */
        #final-text-container {
            opacity: 0;
            display: none;
            transition: opacity 2s ease-in-out;
        }
        #final-text-container.revealed {
            display: flex;
            opacity: 1;
        }

        /* --- Portal Button Animation --- */
        #portal-btn {
            opacity: 0;
            transform: translateY(25px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }
        #portal-btn.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- ================================================================= -->
    <!-- SCENE 1: PEMBUKA / INTRO -->
    <!-- ================================================================= -->
    <div id="scene-1" class="scene active">
        <div class="text-center px-4 w-full max-w-7xl mx-auto flex flex-col items-center justify-center min-h-screen py-8">
            
            <!-- Logo Mengapit Teks Utama -->
            <div class="flex flex-col md:flex-row items-center justify-center gap-6 md:gap-10 lg:gap-14 mb-10 w-full">
                
                <!-- Logo Kiri: Kemenag -->
                <img src="logo_kemenag.png" 
                     alt="Logo Kemenag" 
                     class="w-24 h-24 md:w-32 md:h-32 lg:w-40 lg:h-40 object-contain drop-shadow-[0_10px_20px_rgba(0,0,0,0.7)]">

                <!-- Tumpukan Teks Tengah -->
                <div class="flex flex-col items-center justify-center space-y-2 md:space-y-3">
                    <!-- 1. PERESMIAN -->
                    <span class="font-heading text-2xl md:text-4xl lg:text-5xl font-extrabold text-white tracking-[0.25em] uppercase glow-title">
                        PERESMIAN
                    </span>

                    <!-- 2. Penerimaan Murid Baru Madrasah -->
                    <span class="font-body text-lg md:text-2xl lg:text-3xl font-semibold text-gold-gradient tracking-wide">
                        Penerimaan Murid Baru Madrasah
                    </span>

                    <!-- 3. (PMBM) -->
                    <span class="font-heading text-4xl md:text-6xl lg:text-7xl font-black text-white tracking-wider drop-shadow-lg leading-none py-1">
                        (PMBM)
                    </span>

                    <!-- 4. MTs. Daarul Hikmah Pamulang -->
                    <span class="font-heading text-2xl md:text-4xl lg:text-5xl font-bold text-gold-gradient drop-shadow-md pt-1">
                        MTs. Daarul Hikmah Pamulang
                    </span>

                    <!-- 5. Tahun 2027/2028 -->
                    <span class="font-body text-lg md:text-2xl lg:text-3xl font-medium text-gray-300 tracking-[0.25em] uppercase pt-1">
                        Tahun 2027/2028
                    </span>
                </div>

                <!-- Logo Kanan: MTs. Daarul Hikmah -->
                <!-- CATATAN: Ganti 'logo-madrasah.png' dengan nama file logo lokal Anda jika dihosting offline -->
                <img src="logo_mts.png" 
                     alt="Logo MTs Daarul Hikmah" 
                     onerror="this.onerror=null; this.src='https://placehold.co/160x160/1e3a8a/ffffff?text=Logo+MTs';" 
                     class="w-24 h-24 md:w-32 md:h-32 lg:w-40 lg:h-40 object-contain drop-shadow-[0_10px_20px_rgba(0,0,0,0.7)]">
            </div>

            <!-- Tombol MULAI -->
            <button onclick="startLaunching()" 
                    class="px-14 py-4 bg-white text-gray-900 font-bold font-heading rounded-full hover:bg-gray-200 transition-transform transform hover:scale-105 text-xl md:text-2xl shadow-[0_0_35px_rgba(255,255,255,0.4)] tracking-widest uppercase cursor-pointer">
                MULAI
            </button>

        </div>
    </div>

    <!-- ================================================================= -->
    <!-- SCENE 2: TOMBOL PERESMIAN & COUNTDOWN -->
    <!-- ================================================================= -->
    <div id="scene-2" class="scene">
        
        <!-- Wadah Tombol Fisik 3D Biru -->
        <div id="launch-button-container" class="flex flex-col items-center justify-center">
            <div class="btn-3d-wrapper">
                <div id="btn-launch-physical" class="btn-3d" onclick="triggerLaunch()">
                    <!-- Ikon Saklar/Power -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="btn-3d-icon">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1012.728 0M12 3v9" />
                    </svg>
                </div>
            </div>
            <p id="instruction-text" class="mt-6 font-heading text-gold-400 tracking-[0.3em] uppercase text-sm md:text-base font-semibold drop-shadow-md">
                Silakan Tekan Untuk Meresmikan
            </p>
        </div>

        <!-- Tampilan Hitung Mundur (Hitungan 5 ke 0) -->
        <div id="countdown-container" class="text-center w-full absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
            <div id="countdown-value" class="countdown-number">5</div>
        </div>
    </div>

    <!-- ================================================================= -->
    <!-- SCENE 3: VIDEO PEMBUKA & SCENE 4: PENUTUP AKHIR -->
    <!-- ================================================================= -->
    <div id="scene-3" class="scene bg-black">
        
        <!-- Pemutar Video Pembuka -->
        <!-- CATATAN: Ganti 'video-pmbm.mp4' dengan file video peresmian Anda -->
        <video id="launch-video" class="w-full h-full object-contain absolute inset-0 z-10" preload="auto" controls onended="goToFinalScene()">
            <source src="launching.mp4" type="video/mp4">
            <!-- Fallback URL untuk pengujian jika video lokal belum diunggah -->
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Browser Anda tidak mendukung tag pemutar video.
        </video>

        <!-- Tombol Lewati Video (Pojok Kanan Bawah) -->
        <button id="skip-btn" onclick="goToFinalScene()" class="absolute bottom-10 right-10 z-20 border border-white/20 bg-black/50 text-white/60 px-6 py-2 rounded-full text-sm hover:text-white hover:border-white transition backdrop-blur-sm">
            Skip Video &rarr;
        </button>

        <!-- SCENE 4: SCENE PENUTUP / FINAL STATE -->
        <div id="final-text-container" class="absolute inset-0 z-30 bg-[#050505] flex-col justify-center items-center px-10 text-center">
            
            <!-- 1. PMBM -->
            <h1 class="font-heading font-extrabold text-6xl md:text-8xl lg:text-9xl text-gold-400 tracking-wider drop-shadow-[0_0_35px_rgba(212,175,55,0.5)] mb-2">
                PMBM
            </h1>

            <!-- 2. MTs. Daarul Hikmah -->
            <h2 class="font-heading font-bold text-3xl md:text-5xl lg:text-6xl text-gold-gradient tracking-wide mb-6 drop-shadow-[0_0_20px_rgba(212,175,55,0.3)]">
                MTs. Daarul Hikmah
            </h2>

            <!-- 3. TELAH RESMI DIBUKA! -->
            <h3 class="font-heading font-black text-4xl md:text-6xl lg:text-7xl uppercase tracking-widest glow-gold-text drop-shadow-[0_0_40px_rgba(212,175,55,0.6)] mb-12">
                TELAH RESMI DIBUKA!
            </h3>

            <!-- Tombol Menuju Portal Resmi -->
            <button onclick="goToPortal()" id="portal-btn" class="bg-gradient-to-r from-gold-600 via-gold-500 to-gold-400 text-[#050505] font-bold font-heading uppercase tracking-widest px-10 py-5 rounded-full shadow-[0_0_30px_rgba(212,175,55,0.4)] hover:scale-105 hover:shadow-[0_0_50px_rgba(212,175,55,0.7)] transition-all duration-300 cursor-pointer">
                Buka Portal Resmi PMBM
            </button>
        </div>

    </div>

    <!-- ================================================================= -->
    <!-- LOGIKA JAVASCRIPT & SINTESIS AUDIO -->
    <!-- ================================================================= -->
    <script>
        // DOM Elements
        const scene1 = document.getElementById('scene-1');
        const scene2 = document.getElementById('scene-2');
        const scene3 = document.getElementById('scene-3');
        
        const launchContainer = document.getElementById('launch-button-container');
        const countdownContainer = document.getElementById('countdown-container');
        const countdownValue = document.getElementById('countdown-value');
        
        const launchVideo = document.getElementById('launch-video');
        const skipBtn = document.getElementById('skip-btn');
        const finalTextContainer = document.getElementById('final-text-container');
        const portalBtn = document.getElementById('portal-btn');

        let audioCtx;

        // --- 1. Web Audio API Synthesizers ---
        function initAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }

        // Dampak Sinematik saat Tombol Ditekan
        function playCinematicImpact() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            // Sub-Bass Boom Drop
            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(180, now);
            subOsc.frequency.exponentialRampToValueAtTime(30, now + 1.8);
            subGain.gain.setValueAtTime(1.0, now);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);

            subOsc.connect(subGain);
            subGain.connect(audioCtx.destination);
            subOsc.start(now);
            subOsc.stop(now + 1.8);

            // Resonansi Brass Logam
            const brassFreqs = [110, 164.81, 220, 329.63];
            brassFreqs.forEach(freq => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.25, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 2.5);
            });
        }

        // Efek Penegasan Tekanan Tombol
        function playClickSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
        }

        // Suara Dramatis Menjelang Countdown
        function playDramaticBuildup() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(50, now); 
            osc.frequency.exponentialRampToValueAtTime(600, now + 5.2);
            
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.3, now + 0.5);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 5.2);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start(now);
            osc.stop(now + 5.2);
        }

        // Detak Nada Hitung Mundur (Ascending Pitch 5 ke 1)
        function playCountdownTick(count) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            const pitchMap = {
                5: 440,    // A4
                4: 523.25, // C5
                3: 659.25, // E5
                2: 783.99, // G5
                1: 1046.50 // C6
            };

            const freq = pitchMap[count] || 440;

            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc1.type = 'sine';
            osc2.type = 'triangle';

            osc1.frequency.setValueAtTime(freq, now);
            osc2.frequency.setValueAtTime(freq * 2, now);

            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.4, now + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 0.25);
            osc2.stop(now + 0.25);
        }

        // Fanfare Klimaks Saat Countdown Menyentuh Angka 0
        function playFanfareClimax() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            const chords = [523.25, 659.25, 783.99, 1046.50];
            chords.forEach(freq => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.35, now + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 2.0);
            });
        }

        // --- 2. Navigasi Scene ---
        function fadeToScene(hideEl, showEl, delay = 800) {
            hideEl.classList.remove('active');
            setTimeout(() => {
                showEl.classList.add('active');
            }, delay);
        }

        // --- 3. Alur Eksekusi Sistem ---

        // SCENE 1 -> SCENE 2: Mulai Launching
        function startLaunching() {
            // Mode Fullscreen
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen().catch(e => console.log(e));
            
            // Inisialisasi Suara
            initAudio();

            fadeToScene(scene1, scene2);
        }

        // SCENE 2: Tekan Tombol 3D Biru -> Countdown
        function triggerLaunch() {
            const physicalBtn = document.getElementById('btn-launch-physical');
            
            if (physicalBtn.classList.contains('pressed')) return;

            // 1. Animasi tombol fisik tertekan
            physicalBtn.classList.add('pressed');

            // 2. Mainkan Suara Impact & Klik
            playClickSound();
            playCinematicImpact();
            
            setTimeout(() => {
                playDramaticBuildup();
            }, 200);

            // 3. Transisi Kilatan Layar Biru -> Tampilkan Countdown
            setTimeout(() => {
                launchContainer.style.transition = "opacity 0.8s ease, transform 0.8s ease";
                launchContainer.style.opacity = "0";
                launchContainer.style.transform = "scale(1.2)";
                
                document.body.style.transition = "background-color 0.2s ease";
                document.body.style.backgroundColor = "#1e3a8a"; 
                
                setTimeout(() => {
                    document.body.style.backgroundColor = "#050505";
                    launchContainer.style.display = "none";
                    countdownContainer.classList.add('visible');
                    
                    startCountdownTimer();
                }, 400); 

            }, 800);
        }

        // Hitung Mundur 5.. 4.. 3.. 2.. 1.. 0
        function startCountdownTimer() {
            let count = 5;
            
            countdownValue.innerText = count;
            countdownValue.classList.add('pop');
            playCountdownTick(count);

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownValue.classList.remove('pop');
                    void countdownValue.offsetWidth; // Memicu CSS reflow
                    countdownValue.classList.add('pop');
                    countdownValue.innerText = count;
                    playCountdownTick(count);
                } else {
                    clearInterval(interval);
                    
                    playFanfareClimax();
                    
                    // Pindah ke SCENE 3 (Video)
                    fadeToScene(scene2, scene3);
                    setTimeout(() => {
                        startVideo();
                    }, 1000);
                }
            }, 1000);
        }

        // Memutar Video
        function startVideo() {
            launchVideo.volume = 1.0;
            launchVideo.play().catch(err => console.log("Autoplay dicegah browser:", err));
        }

        // SCENE 3 -> SCENE 4: Video Selesai -> Tampilan Penutup
        function goToFinalScene() {
            launchVideo.pause();
            
            launchVideo.style.transition = "opacity 1.5s ease";
            launchVideo.style.opacity = "0";
            skipBtn.style.opacity = "0";
            
            setTimeout(() => {
                launchVideo.style.display = "none";
                skipBtn.style.display = "none";
                
                // Munculkan Teks Penutup (SCENE 4)
                finalTextContainer.classList.add('revealed');
                
                // Munculkan Tombol Portal
                setTimeout(() => {
                    portalBtn.classList.add('visible');
                }, 1500);

            }, 1500);
        }

        // FUNGSI UTAMA REDIRECT KE PORTAL RESMI NETLIFY
        function goToPortal() {
            // URL Portal PMBM Resmi Anda:
            window.location.href = "https://pmbm-mtsdaarulhikmahpamulang.netlify.app";
        }

    </script>
</body>
</html>
